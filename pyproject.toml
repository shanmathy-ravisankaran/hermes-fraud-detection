
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-fraud-detection"
version = "0.1.0"
description = "Machine learning fraud detection and risk monitoring platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "streamlit>=1.38,<2",
    "plotly>=5.24,<7",
    "shap>=0.46,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "joblib>=1.4,<2",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "mlflow>=2.16,<4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ml*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
